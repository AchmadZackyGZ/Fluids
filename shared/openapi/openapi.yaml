openapi: 3.0.3
info:
  title: Fluids Social Media API
  version: 1.0.0
  description: Monorepo API Specification for Fluids Social Platform
paths:
  /api/v1/auth/register:
    post:
      summary: Register new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /api/v1/reco/explore:
    get:
      summary: Get personalize recommendation feed (Two-Tower AI)
      operationId: getExploreFeed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of recommended posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreResponse"

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user_id:
          type: string
          format: uuid

    ExploreResponse:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/PostItem"

    PostItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
        media_url:
          type: string
        caption:
          type: string
        score:
          type: number
          format: float
